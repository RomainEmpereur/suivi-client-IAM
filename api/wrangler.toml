# Worker de l'espace Obsidian Partners — sert l'API (/api/*) ET l'interface (intégrée au script) sur un seul domaine.
# Aucun secret ici : `wrangler secret put` uniquement (voir README).
name = "espace-obsidian-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# ─── Développement local (Vite sert l'interface sur :5173) ────
[vars]
ENVIRONMENT = "development"
# Connexion de développement par en-tête X-Dev-User : refusée en production.
DEV_AUTH = "1"

[[d1_databases]]
binding = "DB"
database_name = "espace-obsidian"
database_id = "00000000-0000-0000-0000-000000000000"   # base locale uniquement
migrations_dir = "../db/migrations"

# ─── Démo en ligne : données fictives uniquement, derrière Cloudflare Access ───
# Après la connexion Access, on choisit une identité de démonstration (*.demo.local).
[env.demo]
name = "espace-obsidian-demo"
workers_dev = true
preview_urls = false   # pas d'adresse secondaire hors de la protection Access
main = "src/worker.ts"   # API + interface intégrée (npm run build:worker)

[env.demo.vars]
ENVIRONMENT = "demo"
DEV_AUTH = "1"
ACCESS_TEAM_DOMAIN = "infrastructure-acquisition.cloudflareaccess.com"
# « Application Audience (AUD) Tag » de l'application Access « Espace Obsidian — démo » (identifiant public, pas un secret)
ACCESS_AUD = "793ae202165da0a102595bf35c44a8c0a994740495076043543d496e027a64e8"

# Fichiers (guides PDF, ressources) : espace R2 privé, servi uniquement par l'API (mêmes droits que l'objet lié).
[[env.demo.r2_buckets]]
binding = "FILES"
bucket_name = "espace-obsidian-demo-fichiers"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "espace-obsidian-demo"
database_id = "67a23350-d58a-49a0-8f96-62ea222cd71c"
migrations_dir = "../db/migrations"

# ─── Production : vrais clients, aucune donnée de démonstration ───
[env.production]
name = "espace-obsidian"
workers_dev = true        # https://espace-obsidian.obsidianpartners.workers.dev, en attendant espace.obsidianpartners.fr
preview_urls = false
main = "src/worker.ts"   # API + interface intégrée (npm run build:worker)
# routes = [{ pattern = "espace.obsidianpartners.fr", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"
DEV_AUTH = "0"
ACCESS_TEAM_DOMAIN = "infrastructure-acquisition.cloudflareaccess.com"
# AUD de l'application Access « Espace Obsidian — production » (identifiant public, pas un secret)
ACCESS_AUD = "6b6a35235e43e249d7f21421433404944036eca9007a8a6cfba6c2e744434a1c"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "espace-obsidian-fichiers"

[[env.production.d1_databases]]
binding = "DB"
database_name = "espace-obsidian"
database_id = "f6ed1704-2286-4e12-868b-c1c2cf79b4e0"
migrations_dir = "../db/migrations"

# Synchronisation quotidienne (§13) : 4 h et 5 h UTC ; le Worker ne travaille que s'il est 6 h à Paris (été comme hiver).
[env.production.triggers]
crons = ["0 4 * * *", "0 5 * * *"]

# Journaux du Worker (messages d'erreur sans jeton ni donnée personnelle), consultables dans le tableau de bord Cloudflare.
[env.production.observability]
enabled = true
